[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roppy"
version = "0.2.0"
description = "A modern Python pwning toolkit for binary exploitation"
readme = "README.md"
authors = [
    { name = "D4mianWayne", email = "dubeyayushmanrobin@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["pwn", "rop", "exploit", "binary exploitation", "ctf", "security"]
requires-python = ">=3.8"
dependencies = [
    "pyelftools>=0.29",
    "requests>=2.28.0",
    "capstone>=5.0.0",
    "keystone-engine>=0.9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/D4mianWayne/roppy"
Repository = "https://github.com/D4mianWayne/roppy"
Documentation = "https://github.com/D4mianWayne/roppy/wiki"
Issues = "https://github.com/D4mianWayne/roppy/issues"

[project.scripts]
roppy = "roppy.__init__:main"

[tool.setuptools.packages.find]
exclude = ["examples*", "tests*", "docs*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "N802",  # function name should be lowercase (for consistency with existing code)
    "N806",  # variable in function should be lowercase (for consistency)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=roppy --cov-report=term-missing"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
